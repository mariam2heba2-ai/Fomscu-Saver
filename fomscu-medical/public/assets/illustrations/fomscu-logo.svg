<svg viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .fomscu-text { font-family: 'Arial', sans-serif; fill: #E8F5F5; }
      .fomscu-bold { font-weight: bold; }
      .fomscu-circle-bg { fill: #1B5E5E; stroke: #E8F5F5; }
      .icon-stroke { stroke: #C0C0C0; fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="150" cy="155" r="130" class="fomscu-circle-bg" stroke-width="2.5"/>
  
  <!-- Outer decorative circle border -->
  <circle cx="150" cy="155" r="127" fill="none" stroke="#E8F5F5" stroke-width="1.5"/>
  
  <!-- SCIENTIFIC GROUP text (curved) -->
  <text x="150" y="50" text-anchor="middle" class="fomscu-text fomscu-bold" font-size="16" letter-spacing="2.5">
    SCIENTIFIC GROUP
  </text>
  
  <!-- Medical Icons - Top Left: Anatomy (Human figure + Brain) -->
  <g transform="translate(50, 80)">
    <!-- Human figure -->
    <circle cx="0" cy="-5" r="3" class="icon-stroke"/>
    <path d="M 0 0 L 0 6 M -3 2 L 3 2 M -2 6 L -4 10 M 2 6 L 4 10" class="icon-stroke"/>
    <!-- Brain -->
    <g transform="translate(8, 0)">
      <path d="M 0 -5 Q -4 -3 -4 1 Q -4 5 0 6 Q 4 5 4 1 Q 4 -3 0 -5 Z" class="icon-stroke"/>
      <path d="M -2 -2 L -2 3 M 0 -4 L 0 3 M 2 -2 L 2 3" stroke="#C0C0C0" stroke-width="0.8" fill="none"/>
    </g>
  </g>
  
  <!-- Medical Icons - Top Right: DNA -->
  <g transform="translate(250, 80)">
    <path d="M -4 -6 Q 0 -4 4 -6 Q 0 0 -4 6 Q 0 8 4 6" class="icon-stroke"/>
    <line x1="-3" y1="-4" x2="3" y2="-4" stroke="#C0C0C0" stroke-width="0.8"/>
    <line x1="-2" y1="0" x2="2" y2="0" stroke="#C0C0C0" stroke-width="0.8"/>
    <line x1="-3" y1="4" x2="3" y2="4" stroke="#C0C0C0" stroke-width="0.8"/>
  </g>
  
  <!-- Medical Icons - Left: Microscope with slide -->
  <g transform="translate(30, 155)">
    <!-- Microscope body -->
    <circle cx="0" cy="-4" r="3" class="icon-stroke"/>
    <path d="M -1.5 0 L -2 4 M 1.5 0 L 2 4" class="icon-stroke"/>
    <rect x="-2.5" y="4" width="5" height="2" class="icon-stroke"/>
    <!-- Lens detail -->
    <circle cx="0" cy="-4" r="1.5" fill="none" stroke="#C0C0C0" stroke-width="0.6"/>
  </g>
  
  <!-- Medical Icons - Right: Cell/Petri dish with patterns -->
  <g transform="translate(270, 155)">
    <!-- Petri dish -->
    <ellipse cx="0" cy="-1.5" rx="4.5" ry="2.5" class="icon-stroke"/>
    <path d="M -4.5 -1.5 Q -5 2 0 4 Q 5 2 4.5 -1.5" fill="none" stroke="#C0C0C0" stroke-width="1.2"/>
    <!-- Cell details -->
    <circle cx="-1.5" cy="0" r="1.2" fill="none" stroke="#C0C0C0" stroke-width="0.7"/>
    <circle cx="2" cy="1.5" r="0.9" fill="none" stroke="#C0C0C0" stroke-width="0.7"/>
    <circle cx="-0.5" cy="2.5" r="0.7" fill="none" stroke="#C0C0C0" stroke-width="0.5"/>
  </g>
  
  <!-- Medical Icons - Bottom Left: Biochemistry (Flask with contents) -->
  <g transform="translate(50, 225)">
    <!-- Flask -->
    <path d="M -3 -4 L -3.5 0 L -2.5 5 L 2.5 5 L 3.5 0 L 3 -4 Z" class="icon-stroke"/>
    <!-- Liquid inside -->
    <path d="M -3 0 L -2.5 3 L 2.5 3 L 3 0" fill="#C0C0C0" opacity="0.4"/>
    <!-- Stopper -->
    <rect x="-1.5" y="-5" width="3" height="1.2" class="icon-stroke"/>
  </g>
  
  <!-- Medical Icons - Bottom Right: Histology (Tissue patterns) -->
  <g transform="translate(270, 225)">
    <!-- Outer circle (cell boundary) -->
    <circle cx="0" cy="0" r="4" class="icon-stroke"/>
    <!-- Internal tissue patterns -->
    <circle cx="-1.5" cy="-1" r="1.2" fill="none" stroke="#C0C0C0" stroke-width="0.7"/>
    <circle cx="1.5" cy="-1.5" r="0.9" fill="none" stroke="#C0C0C0" stroke-width="0.7"/>
    <circle cx="-0.5" cy="1.5" r="1" fill="none" stroke="#C0C0C0" stroke-width="0.7"/>
    <circle cx="2" cy="1" r="0.8" fill="none" stroke="#C0C0C0" stroke-width="0.6"/>
  </g>
  
  <!-- Center: Stethoscope and Heartbeat -->
  <g transform="translate(150, 145)">
    <!-- Stethoscope earpieces -->
    <path d="M -24 -10 Q -24 -2 -14 -2 Q -6 -2 -6 8 L 6 8 Q 6 -2 14 -2 Q 24 -2 24 -10" 
          class="icon-stroke" stroke-width="2.8"/>
    
    <!-- Heartbeat line -->
    <path d="M -38 8 L -24 8 L -18 -2 L -12 16 L -6 8 L 0 8 L 8 -4 L 14 14 L 20 8 L 38 8" 
          class="icon-stroke" stroke-width="2.2"/>
  </g>
  
  <!-- FOMSCU text -->
  <text x="150" y="190" text-anchor="middle" class="fomscu-text fomscu-bold" font-size="36" letter-spacing="1">
    FOMSCU
  </text>
  
  <!-- FACULTY OF MEDICINE text -->
  <text x="150" y="215" text-anchor="middle" class="fomscu-text" font-size="13" letter-spacing="1">
    FACULTY OF MEDICINE
  </text>
  
  <!-- Year 2026-2031 -->
  <text x="150" y="240" text-anchor="middle" class="fomscu-text fomscu-bold" font-size="18">
    2026-2031
  </text>
  
  <!-- Caduceus symbol at bottom center -->
  <g transform="translate(150, 265)">
    <path d="M 0 -8 L -2 -2 L -4 4 M 0 -8 L 2 -2 L 4 4 M -4 4 Q -5.5 6 -4 7.5 Q -2 9 0 9 Q 2 9 4 7.5 Q 5.5 6 4 4" 
          class="icon-stroke" stroke-width="1.4"/>
    <circle cx="0" cy="-8" r="1.5" fill="#C0C0C0"/>
  </g>
  
  <!-- Bottom tagline -->
  <text x="150" y="330" text-anchor="middle" class="fomscu-text" font-size="11" letter-spacing="2.5" font-weight="500">
    KNOWLEDGE | INNOVATION | RESEARCH
  </text>
</svg>